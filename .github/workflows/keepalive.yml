# Render's free plan sleeps after ~15 minutes idle, which means a 30-60 s wait for whoever opens the link.
# This pings the health endpoint so the demo is always warm. Set the repo variable SITE_URL to the Render URL
# (Settings -> Secrets and variables -> Actions -> Variables). Run it by hand before judging with "Run workflow".
name: keep the demo awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          if [ -z "${{ vars.SITE_URL }}" ]; then echo "SITE_URL variable not set yet; nothing to ping."; exit 0; fi
          curl -fsS --max-time 60 "${{ vars.SITE_URL }}/api/health" | head -c 400

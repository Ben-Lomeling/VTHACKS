# Backend on Render (free plan). Render reads this file when you create a Blueprint from the repo.
# Secrets are NOT in here: set NESSIE_API_KEY, GEMINI_API_KEY (and ALLOWED_ORIGINS once the
# frontend has a URL) in the Render dashboard. See docs/DEPLOY.md.
services:
  - type: web
    name: loadcheck-api
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    # build the site too, so one service serves the whole app
    buildCommand: pip install -r requirements.txt && cd ../frontend && npm ci && npm run build
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DEMO_NOW
        value: "2026-09-21T06:00"
      - key: NESSIE_API_KEY
        sync: false          # set it in the dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false          # e.g. https://loadcheck.tech,https://loadcheck.vercel.app
